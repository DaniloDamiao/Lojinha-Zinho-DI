<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Estoque Pro + Custos</title>
    <style>
        :root { --primary: #006437; --secondary: #34b7f1; --danger: #e74c3c; --edit: #f39c12; --dark: #2c3e50; --bg: #f0f2f5; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 15px; color: var(--dark); }
        .container { max-width: 500px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        input { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { padding: 12px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:active { opacity: 0.7; scale: 0.98; }
        .btn-save { width: 100%; background: var(--primary); margin-top: 10px; }
        .btn-venda { background: var(--secondary); font-size: 13px; }
        .item-estoque { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
        .badge { font-size: 11px; padding: 3px 7px; border-radius: 10px; font-weight: bold; margin-right: 5px; display: inline-block; }
        .badge-estoque { background: #e8f5e9; color: #2e7d32; }
        .badge-alerta { background: #ffebee; color: #c62828; }
        .lucro-val { color: #27ae60; font-weight: bold; font-size: 26px; }
        .sub-info { font-size: 12px; color: #7f8c8d; margin-top: 4px; }
        .hist-item { font-size: 13px; padding: 8px 0; border-bottom: 1px dashed #ddd; display: flex; justify-content: space-between; }
        .venda-data { color: #95a5a6; font-size: 11px; }
        .custo-txt { color: #e74c3c; font-size: 11px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center">🟢 Gestão de Lucro Real</h2>

    <div class="card">
        <h3 id="form-title" style="margin:0 0 10px 0">Novo Produto</h3>
        <input type="hidden" id="edit-id">
        <input type="text" id="nome" placeholder="Nome do Produto">
        <div style="display:flex; gap:5px">
            <input type="number" id="custo" placeholder="Custo R$" step="0.01">
            <input type="number" id="venda" placeholder="Venda R$" step="0.01">
        </div>
        <input type="number" id="qtd" placeholder="Qtd em Estoque">
        <button class="btn-save" id="btn-principal" onclick="processarAcao()">Salvar Produto</button>
        <button id="btn-cancelar" onclick="limparCampos()" style="display:none; background:#bdc3c7; width:100%; margin-top:5px; color: #2c3e50;">Cancelar Edição</button>
    </div>

    <div class="card">
        <input type="text" id="busca" placeholder="🔍 Buscar produto..." onkeyup="renderizar()">
        <div id="listaEstoque"></div>
    </div>

    <div class="card" style="text-align: center;">
        <p style="margin:0">Lucro Total Realizado</p>
        <div id="resumoLucro" class="lucro-val">R$ 0,00</div>
        <button onclick="enviarWhatsApp()" style="background: #075E54; width: 100%; margin-top: 15px;">
            📱 Enviar Relatório p/ WhatsApp
        </button>
    </div>

    <div class="card">
        <h3 style="margin-top:0">🕒 Histórico de Vendas</h3>
        <div id="listaHistorico">
            <p style="color:#95a5a6; font-size:13px">Nenhuma venda realizada.</p>
        </div>
        <button onclick="limparHistorico()" style="background:none; color:var(--danger); font-size:11px; width:100%; margin-top:10px">Limpar Histórico Visual</button>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('estoque_db')) || [];
    let vendas = JSON.parse(localStorage.getItem('vendas_db')) || [];
    let modoEdicao = false;

    function processarAcao() {
        const id = document.getElementById('edit-id').value;
        const nome = document.getElementById('nome').value;
        const custo = parseFloat(document.getElementById('custo').value);
        const venda = parseFloat(document.getElementById('venda').value);
        const qtd = parseInt(document.getElementById('qtd').value);

        if (!nome || isNaN(custo) || isNaN(venda) || isNaN(qtd)) {
            alert("Preencha tudo corretamente!"); return;
        }

        if (modoEdicao) {
            const i = db.findIndex(p => p.id == id);
            db[i] = {...db[i], nome, custo, venda, qtd};
            modoEdicao = false;
        } else {
            db.push({ id: Date.now(), nome, custo, venda, qtd, vendidos: 0, lucroAcumulado: 0, custoAcumulado: 0 });
        }
        salvarTudo();
    }

    function realizarVenda(id) {
        const i = db.findIndex(p => p.id === id);
        if (db[i].qtd > 0) {
            const custoNaHora = db[i].custo;
            const vendaNaHora = db[i].venda;
            const lucroNaHora = vendaNaHora - custoNaHora;
            
            const novaVenda = {
                data: new Date().toLocaleString('pt-BR'),
                nome: db[i].nome,
                venda: vendaNaHora,
                custo: custoNaHora,
                lucro: lucroNaHora
            };
            
            vendas.unshift(novaVenda);
            if(vendas.length > 30) vendas.pop(); 

            db[i].qtd--;
            db[i].vendidos++;
            db[i].lucroAcumulado += lucroNaHora;
            // Registramos também quanto custou o que foi vendido
            db[i].custoAcumulado = (db[i].custoAcumulado || 0) + custoNaHora;
            
            salvarTudo();
        } else {
            alert("Estoque zerado!");
        }
    }

    function editar(id) {
        const p = db.find(prod => prod.id === id);
        document.getElementById('edit-id').value = p.id;
        document.getElementById('nome').value = p.nome;
        document.getElementById('custo').value = p.custo;
        document.getElementById('venda').value = p.venda;
        document.getElementById('qtd').value = p.qtd;
        document.getElementById('form-title').innerText = "Editando Produto";
        document.getElementById('btn-principal').style.background = "var(--edit)";
        document.getElementById('btn-cancelar').style.display = "block";
        modoEdicao = true;
        window.scrollTo(0,0);
    }

    function deletar(id) {
        if(confirm("Excluir produto e histórico?")) {
            db = db.filter(p => p.id !== id);
            salvarTudo();
        }
    }

    function salvarTudo() {
        localStorage.setItem('estoque_db', JSON.stringify(db));
        localStorage.setItem('vendas_db', JSON.stringify(vendas));
        limparCampos();
        renderizar();
    }

    function renderizar() {
        const lista = document.getElementById('listaEstoque');
        const termo = document.getElementById('busca').value.toLowerCase();
        lista.innerHTML = '';
        let totalLucroGeral = 0;

        db.filter(p => p.nome.toLowerCase().includes(termo)).forEach(p => {
            totalLucroGeral += p.lucroAcumulado;
            const classeEstoque = p.qtd <= 3 ? 'badge-alerta' : 'badge-estoque';
            
            lista.innerHTML += `
                <div class="item-estoque">
                    <div class="info">
                        <strong>${p.nome}</strong><br>
                        <span class="badge ${classeEstoque}">Est: ${p.qtd}</span>
                        <span class="badge" style="background:#eee">Vend: ${p.vendidos}</span>
                        <div class="sub-info">Lucro: R$ ${p.lucroAcumulado.toFixed(2)}</div>
                    </div>
                    <div style="display:flex; gap:5px">
                        <button style="background:var(--edit); padding: 8px;" onclick="editar(${p.id})">✎</button>
                        <button style="background:var(--danger); padding: 8px;" onclick="deletar(${p.id})">🗑️</button>
                        <button class="btn-venda" onclick="realizarVenda(${p.id})">VENDA</button>
                    </div>
                </div>`;
        });
        document.getElementById('resumoLucro').innerText = `R$ ${totalLucroGeral.toFixed(2)}`;

        const histLista = document.getElementById('listaHistorico');
        if(vendas.length === 0) {
            histLista.innerHTML = '<p style="color:#95a5a6; font-size:13px">Nenhuma venda.</p>';
        } else {
            histLista.innerHTML = vendas.map(v => `
                <div class="hist-item">
                    <span><b>${v.nome}</b><br><small class="venda-data">${v.data}</small></span>
                    <span style="text-align:right">
                        <span style="color:#27ae60">Lucro: R$ ${v.lucro.toFixed(2)}</span><br>
                        <span class="custo-txt">Custo: R$ ${v.custo.toFixed(2)}</span>
                    </span>
                </div>
            `).join('');
        }
    }

    function limparHistorico() {
        if(confirm("Limpar lista visual?")) {
            vendas = [];
            localStorage.setItem('vendas_db', JSON.stringify(vendas));
            renderizar();
        }
    }

    function enviarWhatsApp() {
        let totalLucro = 0;
        let totalCusto = 0;
        let rel = "*📊 RELATÓRIO DETALHADO*\n\n";
        
        db.forEach(p => {
            totalLucro += p.lucroAcumulado;
            totalCusto += (p.custoAcumulado || 0);
            rel += `📦 *${p.nome.toUpperCase()}*\n`;
            rel += `Vendidos: ${p.vendidos} un.\n`;
            rel += `Custo Total: R$ ${(p.custoAcumulado || 0).toFixed(2)}\n`;
            rel += `Lucro Total: R$ ${p.lucroAcumulado.toFixed(2)}\n`;
            rel += `--------------------------\n`;
        });
        
        rel += `\n*💵 RESUMO FINANCEIRO*`;
        rel += `\nCusto das Mercadorias: R$ ${totalCusto.toFixed(2)}`;
        rel += `\nLucro Líquido: R$ ${totalLucro.toFixed(2)}`;
        rel += `\n\n*TOTAL EM CAIXA: R$ ${(totalCusto + totalLucro).toFixed(2)}*`;
        
        window.open(`https://wa.me/?text=${encodeURIComponent(rel)}`, '_blank');
    }

    function limparCampos() {
        document.getElementById('edit-id').value = '';
        document.getElementById('nome').value = '';
        document.getElementById('custo').value = '';
        document.getElementById('venda').value = '';
        document.getElementById('qtd').value = '';
        document.getElementById('form-title').innerText = "Novo Produto";
        document.getElementById('btn-principal').style.background = "var(--primary)";
        document.getElementById('btn-cancelar').style.display = "none";
        modoEdicao = false;
    }

    renderizar();
</script>
</body>
</html>

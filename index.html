<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque Pro - Lucro Real</title>
    <style>
        :root { --primary: #006437; --secondary: #34b7f1; --danger: #e74c3c; --edit: #f39c12; --dark: #2c3e50; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 15px; color: var(--dark); }
        .container { max-width: 500px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        input { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { padding: 12px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
        .btn-save { width: 100%; background: var(--primary); margin-top: 10px; }
        .btn-venda { background: var(--secondary); font-size: 13px; }
        .item-estoque { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        .badge { font-size: 11px; padding: 3px 7px; border-radius: 10px; font-weight: bold; margin-right: 5px; }
        .badge-estoque { background: #e8f5e9; color: #2e7d32; }
        .lucro-val { color: #27ae60; font-weight: bold; font-size: 22px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center">🟢 Gestão Palmeiras Estoque</h2>

    <div class="card">
        <h3 id="form-title" style="margin:0 0 10px 0">Novo Produto</h3>
        <input type="hidden" id="edit-id">
        <input type="text" id="nome" placeholder="Nome do Produto">
        <div style="display:flex; gap:5px">
            <input type="number" id="custo" placeholder="Custo R$" step="0.01">
            <input type="number" id="venda" placeholder="Venda R$" step="0.01">
        </div>
        <input type="number" id="qtd" placeholder="Qtd em Estoque">
        <button class="btn-save" id="btn-principal" onclick="processarAcao()">Salvar Produto</button>
        <button id="btn-cancelar" onclick="limparCampos()" style="display:none; background:#bdc3c7; width:100%; margin-top:5px">Cancelar</button>
    </div>

    <div class="card">
        <input type="text" id="busca" placeholder="🔍 Buscar..." onkeyup="renderizar()">
        <div id="listaEstoque"></div>
    </div>

    <div class="card" style="text-align: center;">
        <p style="margin:0">Lucro Realizado (Dinheiro no Bolso)</p>
        <div id="resumoLucro" class="lucro-val">R$ 0,00</div>
        <button onclick="enviarWhatsApp()" style="background: #075E54; width: 100%; margin-top: 15px;">
            📱 Enviar Relatório WhatsApp
        </button>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('estoque_db')) || [];
    let modoEdicao = false;

    function processarAcao() {
        const id = document.getElementById('edit-id').value;
        const nome = document.getElementById('nome').value;
        const custo = parseFloat(document.getElementById('custo').value);
        const venda = parseFloat(document.getElementById('venda').value);
        const qtd = parseInt(document.getElementById('qtd').value);

        if (!nome || isNaN(custo) || isNaN(venda)) return alert("Preencha tudo!");

        if (modoEdicao) {
            const i = db.findIndex(p => p.id == id);
            // Atualiza dados mantendo o lucro acumulado antigo intacto
            db[i] = { ...db[i], nome, custo, venda, qtd };
            modoEdicao = false;
        } else {
            // Novo produto começa com lucro zero
            db.push({ id: Date.now(), nome, custo, venda, qtd, vendidos: 0, lucroAcumulado: 0 });
        }
        salvar();
    }

    function realizarVenda(id) {
        const i = db.findIndex(p => p.id === id);
        if (db[i].qtd > 0) {
            // CALCULA O LUCRO DA VENDA ATUAL
            const lucroDestaVenda = db[i].venda - db[i].custo;
            
            db[i].qtd--;
            db[i].vendidos++;
            // SOMA AO LUCRO QUE JÁ ESTAVA GUARDADO
            db[i].lucroAcumulado += lucroDestaVenda;
            
            salvar();
        } else { alert("Sem estoque!"); }
    }

    function editar(id) {
        const p = db.find(prod => prod.id === id);
        document.getElementById('edit-id').value = p.id;
        document.getElementById('nome').value = p.nome;
        document.getElementById('custo').value = p.custo;
        document.getElementById('venda').value = p.venda;
        document.getElementById('qtd').value = p.qtd;
        document.getElementById('btn-principal').innerText = "Atualizar Preços";
        document.getElementById('btn-principal').style.background = "var(--edit)";
        document.getElementById('btn-cancelar').style.display = "block";
        modoEdicao = true;
        window.scrollTo(0,0);
    }

    function salvar() {
        localStorage.setItem('estoque_db', JSON.stringify(db));
        limparCampos();
        renderizar();
    }

    function renderizar() {
        const lista = document.getElementById('listaEstoque');
        const termo = document.getElementById('busca').value.toLowerCase();
        lista.innerHTML = '';
        let lucroTotalGeral = 0;

        db.filter(p => p.nome.toLowerCase().includes(termo)).forEach(p => {
            lucroTotalGeral += p.lucroAcumulado;
            
            lista.innerHTML += `
                <div class="item-estoque">
                    <div class="info">
                        <strong>${p.nome}</strong><br>
                        <span class="badge badge-estoque">Estoque: ${p.qtd}</span>
                        <span class="badge" style="background:#eee">Vendas: ${p.vendidos}</span>
                        <br><small>Lucro acumulado: R$ ${p.lucroAcumulado.toFixed(2)}</small>
                    </div>
                    <div style="display:flex; gap:5px">
                        <button style="background:var(--edit)" onclick="editar(${p.id})">✎</button>
                        <button class="btn-venda" onclick="realizarVenda(${p.id})">VENDA</button>
                    </div>
                </div>`;
        });
        document.getElementById('resumoLucro').innerText = `R$ ${lucroTotalGeral.toFixed(2)}`;
    }

    function enviarWhatsApp() {
        let rel = "📊 BALANÇO DE VENDAS REALIZADAS\n\n";
        let totalGeral = 0;

        db.forEach(p => {
            totalGeral += p.lucroAcumulado;
            rel += • *${p.nome.toUpperCase()}*\n;
            rel += `  💰 Preço Venda: R$ ${p.venda.toFixed(2)}\n`;
            rel += `  📦 Vendidos: ${p.vendidos} un\n`;
            rel += `  📈 Lucro: R$ ${p.lucroAcumulado.toFixed(2)}\n`;
            rel += --------------------------\n;
        });

        rel += \n*✅ TOTAL NO BOLSO: R$ ${totalGeral.toFixed(2)}*;
        
        // Abre o WhatsApp com o relatório formatado
        window.open(https://wa.me/?text=${encodeURIComponent(rel)}, '_blank');
    }

    function limparCampos() {
        document.querySelectorAll('input').forEach(i => i.value = '');
        document.getElementById('btn-principal').innerText = "Salvar Produto";
        document.getElementById('btn-principal').style.background = "var(--primary)";
        document.getElementById('btn-cancelar').style.display = "none";
        modoEdicao = false;
    }

    renderizar();
</script>
</body>
</html>
